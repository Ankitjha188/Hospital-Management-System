<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Appointments</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Appointments</h2>
        <a class="btn primary" th:href="@{/appointments/add}">Book Appointment</a>
    </div>

    <table class="table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Patient</th>
            <th>Doctor</th>
            <th>Date</th>
            <th>Time</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="a : ${appointments}">
            <td th:text="${a.id}"></td>
            <td th:text="${a.patient.name}"></td>
            <td th:text="${a.doctor.name}"></td>
            <td th:text="${a.appointmentDate}"></td>
            <td th:text="${a.appointmentTime}"></td>
            <td th:text="${a.status}"></td>
            <td>
                <a class="btn delete"
                   th:href="@{/appointments/delete/{id}(id=${a.id})}"
                   onclick="return confirm('Cancel this appointment?')">
                    Cancel
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
