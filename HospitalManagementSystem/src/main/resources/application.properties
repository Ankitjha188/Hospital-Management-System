spring.application.name=HospitalManagementSystem

server.port=8081


spring.datasource.url=jdbc:mysql://localhost:3306/hospitaldatabase
spring.datasource.username=root
spring.datasource.password=Param7864872
# driver-class-name is optional for common DBs; Spring Boot can deduce it, but you can set it explicitly:
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate convenience settings (only if using JPA)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

// database initialization

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-location=classpath:data.sql

server.error.include-message=always
server.error.include-binding-errors=always
