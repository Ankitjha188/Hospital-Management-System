<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Patient</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<div class="container">

    <h2>Edit Patient</h2>

    <form class="form"
          th:action="@{/patients/update/{id}(id=${patient.id})}"
          th:object="${patient}"
          method="post">

        <label>ID</label>
        <input type="text" th:value="${patient.id}" readonly>

        <label>Name</label>
        <input type="text" th:field="*{name}" required>

        <label>Phone</label>
        <input type="text" th:field="*{phone}" required>

        <label>Email</label>
        <input type="email" th:field="*{email}" required>

        <label>Birth Date</label>
        <input type="date" th:field="*{birthDate}">

        <label>Gender</label>
        <select th:field="*{gender}">
            <option value="">Select</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>

        <label>Blood Group</label>
        <select th:field="*{bloodGroup}">
            <option value="">Select</option>
            <option th:each="bg : ${T(com.Lilac.HospitalManagementSystem.entity.type.BloodGroupType).values()}"
                    th:value="${bg}"
                    th:text="${bg}">
            </option>
        </select>

        <label class="checkbox">
            <input type="checkbox" th:field="*{active}">
            Active
        </label>

        <label>Address</label>
        <input type="text" th:field="*{address}">

        <div class="actions">
            <button class="btn primary" type="submit">Update</button>
            <a class="btn" th:href="@{/patients}">Cancel</a>
        </div>

    </form>

</div>

</body>
</html>
