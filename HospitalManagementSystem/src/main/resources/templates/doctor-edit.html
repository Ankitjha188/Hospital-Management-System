<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Doctor</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<div class="container">

    <h2>Edit Doctor</h2>

    <form class="form"
          th:action="@{/doctors/update/{id}(id=${doctor.id})}"
          th:object="${doctor}"
          method="post">

        <label>ID</label>
        <input type="text" th:value="${doctor.id}" readonly>

        <label>Name</label>
        <input type="text" th:field="*{name}" required>

        <label>Phone</label>
        <input type="text" th:field="*{phone}" required>

        <label>Email</label>
        <input type="email" th:field="*{email}" required>

        <label>Specialization</label>
        <input type="text" th:field="*{specialization}" required>

        <label>Joining Date</label>
        <input type="date" th:field="*{joiningDate}" required>

        <label class="checkbox">
            <input type="checkbox" th:field="*{active}">
            Active
        </label>

        <div class="actions">
            <button class="btn primary" type="submit">Update</button>
            <a class="btn" th:href="@{/doctors}">Cancel</a>
        </div>

    </form>

</div>

</body>
</html>
