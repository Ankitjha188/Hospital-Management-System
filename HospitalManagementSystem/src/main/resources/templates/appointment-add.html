<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Book Appointment</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<div class="container">
    <h2>Book Appointment</h2>

    <form class="form"
          th:action="@{/appointments/save}"
          th:object="${appointment}"
          method="post">

        <label>Patient</label>
        <select th:field="*{patient}">
            <option th:each="p : ${patients}"
                    th:value="${p.id}"
                    th:text="${p.name}">
            </option>
        </select>

        <label>Doctor</label>
        <select th:field="*{doctor}">
            <option th:each="d : ${doctors}"
                    th:value="${d.id}"
                    th:text="${d.name + ' (' + d.specialization + ')'}">
            </option>
        </select>

        <label>Date</label>
        <input type="date" th:field="*{appointmentDate}" required>

        <label>Time</label>
        <input type="time" th:field="*{appointmentTime}" required>

        <div class="actions">
            <button class="btn primary" type="submit">Confirm</button>
            <a class="btn" th:href="@{/appointments}">Cancel</a>
        </div>

    </form>
</div>

</body>
</html>
